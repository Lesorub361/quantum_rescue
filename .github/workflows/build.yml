name: Build & Release QuantumRescue

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Desktop
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt update
          sudo apt install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev android-tools-adb android-tools-fastboot

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Linux Desktop
        run: |
          flutter build linux --release
          cd build/linux/x64/release/bundle
          tar -czvf /tmp/quantum-rescue-linux-x64.tar.gz *

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quantum-rescue-linux-x64
          path: /tmp/quantum-rescue-linux-x64.tar.gz
          retention-days: 14

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: |
          flutter build apk --release --split-per-abi --no-tree-shake-icons
          flutter build apk --release --no-tree-shake-icons
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/quantum-rescue-universal-release.apk

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quantum-rescue-android-apks
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

  release:
    name: Create GitHub Release
    needs: [build-linux, build-android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: quantum-rescue-linux-x64
          path: release-assets/

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: quantum-rescue-android-apks
          path: release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: QuantumRescue ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            ## ⚡️ QuantumRescue ${{ github.ref_name }} - Universal Android Rescue, Fastboot Flasher & AI Agent

            ### 🚀 Возможности релиза:
            - **⚡️ Fastboot Flashing Studio**: Прошивка разделов `boot`, `init_boot`, `recovery`, `super`, `vbmeta` (с обходом `--disable-verity`).
            - **🛡️ 1-Клик Root (Magisk)**: Автоматическая подготовка и прошивка ядра с правами Root для Xiaomi, Pixel, Samsung, OnePlus.
            - **🤖 Встроенный AI-Агент & Терминал**:
              - Автономный агент понимает задачи на естественном языке (например, *«Верни телефон с Linux Debian на Android с рутом»*, *«Удали рекламу Xiaomi»*).
              - Сам формирует терминальные команды, выполняет их в fastboot/adb и отчитывается о результате.
            - **🧹 Universal Debloater**: 1-клик безопасное удаление системной рекламы MSA, телеметрии Analytics и фоновых демонов.
            - **📱 Кроссплатформенность**: Работает как с компьютера (Linux/Windows), так и со смартфона на смартфон по USB OTG.
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
